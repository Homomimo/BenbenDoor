name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check unsigned packaging policy
        run: python3 ci/test-package.py

      - name: Run protocol tests and build unsigned IPA
        shell: bash
        run: bash ci/build-ios.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BenbenDoor-iOS-unsigned
          path: |
            dist/BenbenDoor-unsigned.ipa
            dist/BuildInfo.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BenbenDoor-iOS-diagnostics
          path: |
            build/ci/*.log
            build/ci/*.json
            build/ci/*.txt
            build/ci/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish unsigned IPA release
    needs: build
    # PRs build for validation. Publish branch pushes and manual branch runs.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the successful build
        uses: actions/download-artifact@v4
        with:
          name: BenbenDoor-iOS-unsigned
          path: dist

      - name: Create release with IPA and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          test -s dist/BenbenDoor-unsigned.ipa
          test -s dist/BuildInfo.json
          (cd dist && sha256sum BenbenDoor-unsigned.ipa BuildInfo.json > SHA256SUMS.txt)
          TAG="ios-build-${BUILD_NUMBER}-${BUILD_ATTEMPT}"
          TITLE="奔奔开门 iOS · Build ${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          {
            printf '## iOS 未签名测试版\n\n'
            printf '下载 BenbenDoor-unsigned.ipa，自行签名后安装。包含 App 与桌面/锁屏小组件，最低 iOS 17。\n\n'
            python3 -c 'import json; info = json.load(open("dist/BuildInfo.json")); print("App 版本：{} · Build {}\n\n构建 SDK：{}\n\n测试：{}\n".format(info["appVersion"], info["build"], info["iosSdk"], info["tests"]))'
            printf '钥匙配置需在 App 内单独导入，发布附件不含真实门锁配置。\n\n'
            printf '提交：`%s`\n\n' "$BUILD_SHA"
            printf '构建记录：%s/%s/actions/runs/%s\n' "$BUILD_SERVER" "$GH_REPO" "$BUILD_RUN_ID"
          } > release-notes.md
          gh release create "$TAG" \
            dist/BenbenDoor-unsigned.ipa dist/BuildInfo.json dist/SHA256SUMS.txt \
            --target "$BUILD_SHA" --title "$TITLE" \
            --notes-file release-notes.md --draft
          gh release edit "$TAG" --draft=false --latest
